<app-header></app-header>

<ion-content [fullscreen]="true" class="vp-content">
  <div class="page-shell">
    <section class="hero-card">
      <h1>{{ 'BATTERY.TITLE' | translate }}</h1>
      <p>{{ 'BATTERY.SUBTITLE' | translate }}</p>
    </section>

    <section class="overview-grid">
      <article class="overview-card" style="cursor:pointer">
        <div class="overview-img-wrap">
          <img src="assets/images/battery.png" alt="Batterie Lithium" class="overview-img" />
        </div>
        <div class="overview-content">
          <div class="overview-title" [innerHTML]="getHtml('BATTERY.FEATURE_1_TITLE')"></div>
          <div class="overview-text" [innerHTML]="getHtml('BATTERY.FEATURE_1_TEXT')"></div>
        </div>
      </article>
    </section>
    <section class="overview-grid">
      <article class="overview-card" style="cursor:pointer">
        <div class="overview-img-wrap">
          <img src="assets/images/battery_agm.png" alt="Batterie AGM" class="overview-img" />
        </div>
        <div class="overview-content">
          <div class="overview-title" [innerHTML]="getHtml('BATTERY.FEATURE_2_TITLE')"></div>
          <div class="overview-text" [innerHTML]="getHtml('BATTERY.FEATURE_2_TEXT')"></div>
        </div>
      </article>
    </section>
  </div>
</ion-content>

<app-footer></app-footer>
